<div class="register-container">
  <div class="register-box">
    <h1>Crear Cuenta</h1>
    <p class="subtitle">Únete a MatchBand</p>
    <form (ngSubmit)="registrar()">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" required>
      </div>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="@usuario" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label for="instrumento">Instrumento Principal</label>
        <input type="text" id="instrumento" [(ngModel)]="instrumento" name="instrumento" placeholder="Ej: Guitarra" required>
      </div>
      <button type="submit" class="btn-register">Crear Cuenta</button>
    </form>
    <p class="login-link">
      ¿Ya tienes cuenta? <a (click)="irALogin()">Inicia sesión</a>
    </p>
  </div>
</div>
