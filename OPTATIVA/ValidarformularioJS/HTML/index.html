<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario Validado</title>
  <link rel="stylesheet" href="/ValidarformularioJS/CSS/style.css" />

</head>
<body>
  <div class="container">
    <h1>Registro de Usuario</h1>
    <form id="registroForm" novalidate>
      
      <!-- 1. Nombre -->
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required />
      <span class="error" id="errorNombre"></span>

      <!-- 2. Apellido -->
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required />
      <span class="error" id="errorApellido"></span>

      <!-- 3. Email -->
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" name="email" required />
      <span class="error" id="errorEmail"></span>

      <!-- 4. Teléfono -->
      <label for="telefono">Teléfono (9 dígitos):</label>
      <input type="tel" id="telefono" name="telefono" required />
      <span class="error" id="errorTelefono"></span>

      <!-- 5. Edad -->
      <label for="edad">Edad (18 a 99):</label>
      <input type="number" id="edad" name="edad" required min="18" max="99" />
      <span class="error" id="errorEdad"></span>

      <!-- 6. Contraseña -->
      <label for="password">Contraseña (mín. 6 caracteres):</label>
      <input type="password" id="password" name="password" required />
      <span class="error" id="errorPassword"></span>

      <!-- 7. Confirmar Contraseña -->
      <label for="confirmPassword">Confirmar Contraseña:</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required />
      <span class="error" id="errorConfirmPassword"></span>

      <!-- 8. Fecha de nacimiento -->
      <label for="fechaNacimiento">Fecha de Nacimiento:</label>
      <input type="date" id="fechaNacimiento" name="fechaNacimiento" required />
      <span class="error" id="errorFechaNacimiento"></span>

      <!-- 9. Género -->
      <label>Género:</label>
      <div class="radio-group">
        <label><input type="radio" name="genero" value="Masculino" required /> Masculino</label>
        <label><input type="radio" name="genero" value="Femenino" required /> Femenino</label>
        <label><input type="radio" name="genero" value="Otro" required /> Otro</label>
      </div>
      <span class="error" id="errorGenero"></span>

      <!-- 10. Términos -->
      <label>
        <input type="checkbox" id="terminos" name="terminos" required />
        Acepto los términos y condiciones
      </label>
      <span class="error" id="errorTerminos"></span>

      <button type="submit" >Registrar</button>
    </form>
  </div>

  <script src="/ValidarformularioJS/JS/script.js"></script>
</body>
</html>
