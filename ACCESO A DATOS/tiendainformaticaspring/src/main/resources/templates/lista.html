<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
	<head>
		 <meta charset="UTF-8">
		 <title>Productos</title>
	</head>
	<body>
		<table>
		       <thead>
		           <tr>
		               <th>Nombre del Producto</th>
		               <th>Precio</th>
					   <th>Categoria</th>
					   <th>Nombre Cliente</th>
		           </tr>
		       </thead>
		       <tbody>
		           <tr th:each="producto : ${productos}">
		               <td th:text="${producto.nombre}">Nombre del Producto</td>
		               <td th:text="${producto.precio}">Precio</td>
					   <td th:text="${producto.categoria.nombre}">Categoria</td>
					   <td>
					           <ul>
					               <li th:each="cliente : ${producto.clientes}" 
					                   th:text="${cliente.nombre}">Nombre Cliente</li>
					           </ul>
					       </td>
		           </tr>
		       </tbody>
		   </table>
	</body>
</html>
